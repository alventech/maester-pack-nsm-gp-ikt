<text x="116" y="528" font-size="15" font-weight="700" fill="#242424" text-anchor="start">The Maester report</text>
<text x="116" y="550" font-size="13" font-weight="400" fill="#605e5c" text-anchor="start">Every test with its result, and a frameworks view per NSM measure</text>
<text x="116" y="568" font-size="13" font-weight="400" fill="#605e5c" text-anchor="start">(GP-IKT 2.1 and the alert), each linked to its text on nsm.no</text>
<rect x="20" y="602" width="680" height="88" rx="8" fill="#fff8e6" stroke="#ffb900" stroke-width="1.5"/>
<text x="36" y="626" font-size="14" font-weight="700" fill="#242424" text-anchor="start">One mapping catalogue behind every test</text>
<text x="36" y="646" font-size="12.5" font-weight="400" fill="#424242" text-anchor="start">tools/data/mapping.json gives each test its NSM measure and clause (Control),</text>
<text x="36" y="664" font-size="12.5" font-weight="400" fill="#424242" text-anchor="start">the strength of the link (direct, partial, indicator) and its scope.</text>
<text x="36" y="682" font-size="12.5" font-weight="400" fill="#424242" text-anchor="start">The docs and the framework files are generated from it.</text>
